  src/pages/stories.html
  =====================================================================
  Custom sections for the Stories / Essays page.
  Edit here → npm run build → changes appear at /stories/
  =====================================================================
-->

<!-- SECTION: stories-hero -->
<section id="csp-stories-hero" style="background:linear-gradient(180deg,#020918 0%,#050D1A 100%);padding:70px 0 50px;border-bottom:1px solid rgba(0,174,254,0.12);">
<style>
#csp-stories-hero{font-family:'Inter',-apple-system,sans-serif;color:#fff;}
.csp-stories-hero-inner{max-width:1100px;margin:0 auto;padding:0 40px;display:flex;align-items:center;justify-content:space-between;gap:40px;flex-wrap:wrap;}
.csp-stories-hero-left{flex:1;min-width:280px;}
.csp-stories-hero-label{font-size:0.72rem;font-weight:700;letter-spacing:0.18em;color:#00AEFE;text-transform:uppercase;margin-bottom:16px;}
.csp-stories-hero-title{font-family:'Merriweather',serif;font-size:clamp(2rem,4vw,3rem);font-weight:400;line-height:1.2;margin:0 0 16px;}
.csp-stories-hero-title em{font-style:normal;background:linear-gradient(135deg,#00AEFE,#B71F71);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.csp-stories-hero-sub{font-size:0.95rem;color:rgba(255,255,255,0.55);line-height:1.7;max-width:480px;}
.csp-stories-hero-stats{display:flex;gap:36px;margin-top:36px;}
.csp-stories-hero-stat-num{font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,#00AEFE,#B71F71);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.csp-stories-hero-stat-lbl{font-size:0.78rem;color:rgba(255,255,255,0.4);margin-top:4px;}
.csp-stories-filter{display:flex;gap:10px;flex-wrap:wrap;flex-shrink:0;}
.csp-stories-filter-btn{padding:10px 22px;border-radius:50px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.6);font-size:0.85rem;cursor:pointer;transition:all 0.2s;font-family:'Inter',sans-serif;}
.csp-stories-filter-btn:hover,.csp-stories-filter-btn.active{background:linear-gradient(135deg,rgba(0,174,254,0.15),rgba(183,31,113,0.1));border-color:rgba(0,174,254,0.4);color:#fff;}
</style>
<div class="csp-stories-hero-inner">
  <div class="csp-stories-hero-left">
    <p class="csp-stories-hero-label">The Library</p>
    <h1 class="csp-stories-hero-title">Essays That <em>Shape Thinking</em></h1>
    <p class="csp-stories-hero-sub">A curated collection of the most rigorous, thought-provoking writing on African identity, policy, science, and culture — by voices from across the diaspora.</p>
    <div class="csp-stories-hero-stats">
      <div>
        <div class="csp-stories-hero-stat-num">500+</div>
        <div class="csp-stories-hero-stat-lbl">Published Essays</div>
      </div>
      <div>
        <div class="csp-stories-hero-stat-num">80+</div>
        <div class="csp-stories-hero-stat-lbl">Contributors</div>
      </div>
      <div>
        <div class="csp-stories-hero-stat-num">2M+</div>
        <div class="csp-stories-hero-stat-lbl">Readers</div>
      </div>
    </div>
  </div>
  <div class="csp-stories-filter">
    <button class="csp-stories-filter-btn active">All Topics</button>
    <button class="csp-stories-filter-btn">Technology</button>
    <button class="csp-stories-filter-btn">Politics</button>
    <button class="csp-stories-filter-btn">Culture</button>
    <button class="csp-stories-filter-btn">Science</button>
    <button class="csp-stories-filter-btn">Education</button>
  </div>
</div>
<script>
(function(){
  var btns = document.querySelectorAll('.csp-stories-filter-btn');
  btns.forEach(function(btn){
    btn.addEventListener('click', function(){
      btns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
    });
  });
})();
</script>
</section>
<!-- /SECTION: stories-hero -->
