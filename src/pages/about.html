<!-- SECTION: about-cta -->
<section id="csp-about-cta" style="background:linear-gradient(135deg,#020918 0%,#08142a 100%);padding:80px 0;position:relative;overflow:hidden;">
<style>
#csp-about-cta{font-family:'Inter',-apple-system,sans-serif;color:#fff;text-align:center;}
#csp-about-cta::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(0,174,254,0.07) 0%,transparent 70%);pointer-events:none;}
.csp-about-cta-inner{max-width:680px;margin:0 auto;padding:0 40px;position:relative;}
.csp-about-cta-label{font-size:0.72rem;font-weight:700;letter-spacing:0.18em;color:#00AEFE;text-transform:uppercase;margin-bottom:20px;}
.csp-about-cta-title{font-family:'Merriweather',serif;font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:400;line-height:1.25;margin:0 0 20px;}
.csp-about-cta-title em{font-style:normal;background:linear-gradient(135deg,#00AEFE,#B71F71);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.csp-about-cta-sub{font-size:1rem;color:rgba(255,255,255,0.6);line-height:1.7;margin:0 0 44px;}
.csp-about-cta-btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.csp-about-cta-btn-primary{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(110deg,#00AEFE,#B71F71);color:#fff;text-decoration:none;font-weight:600;padding:16px 36px;border-radius:50px;font-size:0.92rem;transition:opacity 0.2s,transform 0.2s;}
.csp-about-cta-btn-primary:hover{opacity:0.88;transform:translateY(-2px);}
.csp-about-cta-btn-secondary{display:inline-flex;align-items:center;gap:10px;background:transparent;border:1.5px solid rgba(255,255,255,0.3);color:#fff;text-decoration:none;font-weight:500;padding:15px 36px;border-radius:50px;font-size:0.92rem;transition:border-color 0.2s,background 0.2s;}
.csp-about-cta-btn-secondary:hover{border-color:rgba(255,255,255,0.7);background:rgba(255,255,255,0.05);}
</style>
<div class="csp-about-cta-inner">
  <p class="csp-about-cta-label">Join the Movement</p>
  <h2 class="csp-about-cta-title">Ideas That <em>Move the World</em> Forward</h2>
  <p class="csp-about-cta-sub">Conspodium is where Africa's sharpest minds meet its most pressing questions. We publish essays, host conversations, and build community across the global diaspora.</p>
  <div class="csp-about-cta-btns">
    <a href="../submit-story/" class="csp-about-cta-btn-primary">Submit Your Story →</a>
    <a href="../stories/" class="csp-about-cta-btn-secondary">Read the Essays</a>
  </div>
</div>
</section>
<!-- /SECTION: about-cta -->
