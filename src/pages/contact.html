  src/pages/contact.html
  =====================================================================
  Custom sections for the Contact Us page.
  Edit here → npm run build → changes appear at /contact-us/
  =====================================================================

<!-- SECTION: contact-banner -->
<section id="csp-contact-banner" style="background:linear-gradient(180deg,#020918 0%,#050D1A 100%);padding:70px 0;border-bottom:1px solid rgba(0,174,254,0.12);">
<style>
#csp-contact-banner{font-family:'Inter',-apple-system,sans-serif;color:#fff;text-align:center;}
.csp-contact-banner-inner{max-width:680px;margin:0 auto;padding:0 40px;}
.csp-contact-banner-label{font-size:0.72rem;font-weight:700;letter-spacing:0.18em;color:#00AEFE;text-transform:uppercase;margin-bottom:16px;}
.csp-contact-banner-title{font-family:'Merriweather',serif;font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:400;margin:0 0 16px;line-height:1.25;}
.csp-contact-banner-title em{font-style:normal;background:linear-gradient(135deg,#00AEFE,#B71F71);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.csp-contact-banner-sub{font-size:1rem;color:rgba(255,255,255,0.55);line-height:1.7;}
.csp-contact-channels{display:flex;justify-content:center;gap:20px;margin-top:44px;flex-wrap:wrap;}
.csp-contact-channel{display:flex;align-items:center;gap:12px;padding:18px 28px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:16px;text-decoration:none;color:#fff;transition:border-color 0.2s,background 0.2s,transform 0.2s;min-width:200px;}
.csp-contact-channel:hover{border-color:rgba(0,174,254,0.4);background:rgba(0,174,254,0.06);transform:translateY(-3px);}
.csp-contact-channel-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,rgba(0,174,254,0.2),rgba(183,31,113,0.15));display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.csp-contact-channel-label{font-size:0.78rem;color:rgba(255,255,255,0.4);margin-bottom:2px;}
.csp-contact-channel-value{font-size:0.9rem;font-weight:600;color:#fff;}
</style>
<div class="csp-contact-banner-inner">
  <p class="csp-contact-banner-label">Get in Touch</p>
  <h1 class="csp-contact-banner-title">We'd Love to <em>Hear From You</em></h1>
  <p class="csp-contact-banner-sub">Whether you have a story to submit, a partnership proposal, or just want to say hello — our team is always listening.</p>
  <div class="csp-contact-channels">
    <a href="mailto:hello@conspodium.com" class="csp-contact-channel">
      <div class="csp-contact-channel-icon">✉️</div>
      <div>
        <div class="csp-contact-channel-label">Email us at</div>
        <div class="csp-contact-channel-value">hello@conspodium.com</div>
      </div>
    </a>
    <a href="https://twitter.com/conspodium" class="csp-contact-channel" target="_blank" rel="noopener">
      <div class="csp-contact-channel-icon">𝕏</div>
      <div>
        <div class="csp-contact-channel-label">Follow us on</div>
        <div class="csp-contact-channel-value">@conspodium</div>
      </div>
    </a>
  </div>
</div>
</section>
<!-- /SECTION: contact-banner -->
