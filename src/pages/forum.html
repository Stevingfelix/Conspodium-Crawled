  <script>
    (function(){
      var activeCat = 'All';
      var currentThreadId = null;

      function initCategorySliderControls() {
        var leftBtn = document.getElementById('cat-slide-left');
        var rightBtn = document.getElementById('cat-slide-right');
        var filters = document.getElementById('forum-category-filters');
        if (!leftBtn || !rightBtn || !filters) return;

        function updateArrowState() {
          var scrollLeft = Math.ceil(filters.scrollLeft);
          var maxScroll = Math.floor(filters.scrollWidth - filters.clientWidth);

          if (scrollLeft <= 5) {
            leftBtn.classList.add('disabled');
          } else {
            leftBtn.classList.remove('disabled');
          }

          if (scrollLeft >= maxScroll - 5) {
            rightBtn.classList.add('disabled');
          } else {
            rightBtn.classList.remove('disabled');
          }
        }

        leftBtn.onclick = function() {
          filters.scrollBy({ left: -280, behavior: 'smooth' });
        };

        rightBtn.onclick = function() {
          filters.scrollBy({ left: 280, behavior: 'smooth' });
        };

        filters.onscroll = updateArrowState;
        window.addEventListener('resize', updateArrowState);
        window.updateCatSliderArrows = updateArrowState;
        setTimeout(updateArrowState, 200);
      }

      function loadCategories() {
        fetch('/api/categories.php')
          .then(function(r){ return r.json(); })
          .then(function(res){
            if (!res.success || !res.data) return;
            var filterContainer = document.getElementById('forum-category-filters');
            var selectElement = document.getElementById('th-category');

            filterContainer.innerHTML = '<button class="csp-filter-chip active" data-cat="All">All Discussions</button><button class="csp-filter-chip" data-cat="General Discussion">💬 General Discussion</button>';
            selectElement.innerHTML = '<option value="General Discussion">General Discussion</option>';

            res.data.forEach(function(c){
              filterContainer.innerHTML += '<button class="csp-filter-chip" data-cat="' + c.name + '">' + (c.icon || '🏷️') + ' ' + c.name + '</button>';
              selectElement.innerHTML += '<option value="' + c.name + '">' + c.name + '</option>';
            });

            // Re-bind click handlers
            filterContainer.querySelectorAll('.csp-filter-chip').forEach(function(chip){
              chip.addEventListener('click', function(){
                filterContainer.querySelectorAll('.csp-filter-chip').forEach(function(c){ c.classList.remove('active'); });
                chip.classList.add('active');
                activeCat = chip.dataset.cat;
                chip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                loadThreads();
              });
            });

            if (window.updateCatSliderArrows) {
              setTimeout(window.updateCatSliderArrows, 200);
            }
          });
      }

      function loadThreads() {
        var container = document.getElementById('forum-threads-list');
        if (container) {
          container.innerHTML = `
            <div class="csp-thread-card" style="pointer-events:none;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <div class="csp-skeleton-pulse" style="width:130px;height:16px;border-radius:50px;"></div>
                <div class="csp-skeleton-pulse" style="width:80px;height:24px;border-radius:50px;"></div>
              </div>
              <div class="csp-skeleton-pulse" style="width:75%;height:22px;margin-bottom:12px;border-radius:6px;"></div>
              <div class="csp-skeleton-pulse" style="width:100%;height:14px;margin-bottom:8px;border-radius:4px;"></div>
              <div class="csp-skeleton-pulse" style="width:60%;height:14px;margin-bottom:16px;border-radius:4px;"></div>
              <div style="display:flex;gap:16px;align-items:center;">
                <div class="csp-skeleton-pulse" style="width:110px;height:14px;border-radius:4px;"></div>
                <div class="csp-skeleton-pulse" style="width:80px;height:14px;border-radius:4px;"></div>
                <div class="csp-skeleton-pulse" style="width:70px;height:14px;border-radius:4px;"></div>
              </div>
            </div>
            <div class="csp-thread-card" style="pointer-events:none;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <div class="csp-skeleton-pulse" style="width:110px;height:16px;border-radius:50px;"></div>
                <div class="csp-skeleton-pulse" style="width:80px;height:24px;border-radius:50px;"></div>
              </div>
              <div class="csp-skeleton-pulse" style="width:82%;height:22px;margin-bottom:12px;border-radius:6px;"></div>
              <div class="csp-skeleton-pulse" style="width:100%;height:14px;margin-bottom:8px;border-radius:4px;"></div>
              <div class="csp-skeleton-pulse" style="width:55%;height:14px;margin-bottom:16px;border-radius:4px;"></div>
              <div style="display:flex;gap:16px;align-items:center;">
                <div class="csp-skeleton-pulse" style="width:100px;height:14px;border-radius:4px;"></div>
                <div class="csp-skeleton-pulse" style="width:75px;height:14px;border-radius:4px;"></div>
                <div class="csp-skeleton-pulse" style="width:70px;height:14px;border-radius:4px;"></div>
              </div>
            </div>
          `;
        }

        fetch('/api/forum.php?action=threads&category=' + encodeURIComponent(activeCat))
          .then(function(r){ return r.json(); })
          .then(function(res){
            if (!container) return;
            if (!res.success || !res.data || res.data.length === 0) {
              container.innerHTML = '<div class="csp-thread-card" style="text-align:center;color:#0f172a;font-weight:600;padding:48px 24px;"><p style="font-size:1.1rem;color:#0f172a;margin-bottom:8px;">No discussion topics found in this category.</p><p style="font-size:0.9rem;color:#64748b;font-weight:normal;">Be the first to start a conversation with the community!</p></div>';
              return;
            }

            container.innerHTML = '';
            res.data.forEach(function(t){
              container.innerHTML += `
                <a href="/forum/thread/?id=${t.id}" class="csp-thread-card" style="text-decoration:none;display:block;">
                  <div class="csp-thread-header">
                    <div>
                      <span style="font-size:0.75rem;color:#00AEFE;font-weight:600;margin-bottom:4px;display:inline-block;">${t.is_pinned ? '📌 Pinned • ' : ''}${t.category}</span>
                      <h3 class="csp-thread-title">${t.title}</h3>
                    </div>
                    <span style="font-size:0.85rem;background:rgba(0,174,254,0.12);color:#00AEFE;padding:4px 14px;border-radius:50px;white-space:nowrap;font-weight:600;">💬 ${t.reply_count || 0} Replies</span>
                  </div>
                  <p style="font-size:0.9rem;color:#334155;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.6;">${t.content}</p>
                  <div class="csp-thread-meta">
                    <span style="color:#0f172a;font-weight:500;">By ${t.author_name}</span>
                    <span>👁️ ${t.views || 0} Views</span>
                    <span>${t.created_at ? t.created_at.slice(0,10) : 'Recently'}</span>
                  </div>
                </a>
              `;
            });
          });
      }

      window.viewThread = function(id) {
        currentThreadId = id;
        fetch('/api/forum.php?action=thread&id=' + id)
          .then(function(r){ return r.json(); })
          .then(function(res){
            if (!res.success || !res.data) return;
            var t = res.data.thread;
            var replies = res.data.replies || [];

            document.getElementById('v-thread-title').textContent = t.title;
            document.getElementById('v-thread-cat').textContent = t.category;
            document.getElementById('v-thread-author').textContent = t.author_name;
            document.getElementById('v-thread-date').textContent = t.created_at ? t.created_at.slice(0,16) : 'Recently';
            document.getElementById('v-thread-body').textContent = t.content;

            var rContainer = document.getElementById('v-thread-replies');
            if (replies.length === 0) {
              rContainer.innerHTML = '<p style="color:#64748b;font-size:0.88rem;padding:12px;background:#f8fafc;border-radius:10px;text-align:center;">No replies yet. Start the conversation below!</p>';
            } else {
              rContainer.innerHTML = '';
              replies.forEach(function(rp){
                rContainer.innerHTML += `
                  <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:12px;">
                    <div style="font-size:0.82rem;color:#00AEFE;font-weight:600;margin-bottom:6px;">${rp.author_name} <span style="color:#64748b;font-weight:normal;margin-left:8px;">${rp.created_at ? rp.created_at.slice(0,16) : ''}</span></div>
                    <div style="font-size:0.92rem;color:#0f172a;line-height:1.6;">${rp.content}</div>
                  </div>
                `;
              });
            }

            document.getElementById('modal-view-thread').classList.add('active');
          });
      };

      // Modal Triggers
      document.getElementById('btn-open-thread-modal').onclick = function(){ document.getElementById('modal-create-thread').classList.add('active'); };
      document.getElementById('btn-close-create-thread').onclick = function(){ document.getElementById('modal-create-thread').classList.remove('active'); };
      document.getElementById('btn-close-view-thread').onclick = function(){ document.getElementById('modal-view-thread').classList.remove('active'); };

      // Submit Thread Form
      document.getElementById('form-new-thread').onsubmit = function(e){
        e.preventDefault();
        var payload = {
          title: document.getElementById('th-title').value,
          category: document.getElementById('th-category').value,
          author_name: document.getElementById('th-name').value,
          author_email: document.getElementById('th-email').value,
          content: document.getElementById('th-content').value
        };

        fetch('/api/forum.php?action=create_thread', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(function(r){ return r.json(); })
        .then(function(res){
          if (res.success) {
            alert('🎉 Discussion topic posted successfully!');
            document.getElementById('form-new-thread').reset();
            document.getElementById('modal-create-thread').classList.remove('active');
            if (res.thread_id) {
              window.location.href = '/forum/thread/?id=' + res.thread_id;
            } else {
              loadThreads();
            }
          } else { alert(res.error || 'Failed to create topic'); }
        });
      };

      // Submit Reply Form
      document.getElementById('form-post-reply').onsubmit = function(e){
        e.preventDefault();
        if (!currentThreadId) return;
        var payload = {
          thread_id: currentThreadId,
          author_name: document.getElementById('rp-name').value,
          author_email: document.getElementById('rp-email').value,
          content: document.getElementById('rp-content').value
        };

        fetch('/api/forum.php?action=create_reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(function(r){ return r.json(); })
        .then(function(res){
          if (res.success) {
            document.getElementById('form-post-reply').reset();
            viewThread(currentThreadId);
          } else { alert(res.error || 'Failed to post reply'); }
        });
      };

      initCategorySliderControls();
      loadCategories();
      loadThreads();
    })();
  </script>
</body>
</html>
