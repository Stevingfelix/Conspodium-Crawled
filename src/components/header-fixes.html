<!--
  src/components/header-fixes.html
  =====================================================================
  Injected into <head> of every built page.
  Fixes Elementor/WordPress quirks in the static clone.
  =====================================================================
-->
<style>/* conspodium-fix-preloader */
#sl-preloader { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }
</style>
<style id="csp-header-fixes">
/* Hide the sticky spacer clone that creates a blank gap at top of page */
.elementor-sticky__spacer { display: none !important; }
/* Ensure the real fixed header is always visible */
.she-header-yes, .elementor-sticky { visibility: visible !important; }
/* Fix logo images collapsed to height:0 by JS at crawl time */
img.sticel-logo-shrink { height: auto !important; max-height: 80px !important; width: auto !important; opacity: 1 !important; }

/* Remove transform on sticky header when mobile menu is open so position:fixed spans 100% top to bottom without offset */
body.csp-menu-is-open .she-header-yes,
body.csp-menu-is-open .elementor-sticky,
body.csp-menu-is-open .adv-sticky-elementor,
body.csp-menu-is-open .elementor-element-2d9e131,
body.csp-menu-is-open .elementor-location-header,
body.csp-menu-is-open header {
  transform: none !important;
  -webkit-transform: none !important;
  perspective: none !important;
  filter: none !important;
}

/* ── LOGO FIX: Desktop/tablet logo must be visible on non-mobile screens ────── */
@media (min-width: 768px) {
  .elementor .elementor-hidden-mobile,
  .elementor-hidden-mobile {
    display: block !important;
  }
  .elementor-element-738d6a4 img,
  .elementor-element-738d6a4 .elementor-widget-container {
    display: block !important;
    max-height: 68px !important;
    width: auto !important;
    height: auto !important;
    opacity: 1 !important;
  }
}

/* Mobile square logo (2d4f26f): show ONLY on mobile, hide on tablet + desktop */
.elementor-element-2d4f26f {
  display: none !important;
}
@media (max-width: 767px) {
  .elementor-element-2d4f26f {
    display: block !important;
  }
  .elementor-element-2d4f26f img,
  .elementor-element-2d4f26f .elementor-widget-container {

    max-height: 52px !important;
    width: auto !important;

  }

/* ── HAMBURGER FIX: push burger to far right edge of header (mobile only) ───── */

    flex: 1 !important;

    justify-content: flex-end !important;

  color: #0f172a !important;
  fill: #0f172a !important;
  text-shadow: none !important;
}
body:not(.home) .elementor-1969 .elementor-nav-menu--main .elementor-item:hover,
body:not(.home) .elementor-1969 .elementor-nav-menu--main .elementor-item.elementor-item-active,
body:not(.home) .elementor-1969 .elementor-nav-menu--dropdown .elementor-item:hover,
body:not(.home) .elementor-1969 .elementor-nav-menu--dropdown .elementor-item.elementor-item-active {
  color: #00AEFE !important;
  fill: #00AEFE !important;
  text-shadow: none !important;
}
body:not(.home) .elementor-1969 .elementor-menu-toggle,

/* ── HIDE DESKTOP NAV DROPDOWN TO PREVENT DUPLICATE POPUP ───────────────────── */
.elementor-element-c6b6140 .elementor-nav-menu--dropdown {
  display: none !important;
  visibility: hidden !important;
  pointer-events: none !important;
  opacity: 0 !important;
}

/* ── MODERN ANIMATED POPUP MODAL MENU ───────────────────────────────────────── */
@media (max-width: 1024px) {
  .elementor-element.elementor-element-27c23fa .elementor-nav-menu__container.elementor-nav-menu--dropdown,
  .elementor-element-27c23fa .elementor-nav-menu--dropdown,
  .elementor-nav-menu--dropdown,
  .elementor-nav-menu__container.elementor-nav-menu--dropdown {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    max-height: 100vh !important;
    margin: 0 !important;
    margin-top: 0 !important;
    padding: 0 !important;
    background: rgba(0, 0, 0, 0.25) !important;
    background-color: rgba(0, 0, 0, 0.25) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    z-index: 9999999 !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
    transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.32s cubic-bezier(0.16, 1, 0.3, 1) !important;
  }

  .elementor-element-27c23fa .elementor-menu-toggle.elementor-active + .elementor-nav-menu--dropdown,
  .elementor-element-27c23fa .elementor-menu-toggle.elementor-menu-toggle--active + .elementor-nav-menu--dropdown,
  .elementor-element-27c23fa .elementor-nav-menu--dropdown.elementor-active,
  .elementor-element-27c23fa .elementor-nav-menu--dropdown.csp-menu-open,
  .elementor-nav-menu--dropdown.csp-menu-open {
    opacity: 1 !important;
    pointer-events: auto !important;
    visibility: visible !important;
    display: flex !important;
  }

  .elementor-nav-menu--dropdown ul.elementor-nav-menu {
    width: 88% !important;
    max-width: 360px !important;
    background: rgba(6, 16, 34, 0.88) !important;
    backdrop-filter: blur(24px) !important;
    -webkit-backdrop-filter: blur(24px) !important;
    border: 1px solid rgba(0, 174, 254, 0.3) !important;
    border-radius: 28px !important;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 174, 254, 0.15) !important;
    padding: 60px 20px 32px !important; /* Generous top padding so close button sits cleanly above Home */
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 6px !important;
    margin: auto !important;
    position: relative !important;
    list-style: none !important;
    transform: scale(0.85) translateY(24px);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1) !important;
  }

  .elementor-nav-menu--dropdown ul.elementor-nav-menu > li:first-child {
    margin-top: 6px !important;
  }

  .elementor-nav-menu--dropdown.csp-menu-open ul.elementor-nav-menu,
  .elementor-menu-toggle.elementor-active + .elementor-nav-menu--dropdown ul.elementor-nav-menu {
    transform: scale(1) translateY(0);
  }

  .elementor-nav-menu--dropdown.csp-menu-closing {
    opacity: 0 !important;
    pointer-events: none !important;
  }
  .elementor-nav-menu--dropdown.csp-menu-closing ul.elementor-nav-menu {
    transform: scale(0.9) translateY(16px) !important;
  }

  /* Centered Nav Items with NO Underlines */
  .elementor-nav-menu--dropdown li.menu-item {
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    text-align: center !important;
  }

  .elementor-nav-menu--dropdown .elementor-item {
    font-family: 'Merriweather', Georgia, serif !important;
    font-size: 1.12rem !important;
    font-weight: 500 !important;
    color: #ffffff !important;
    fill: #ffffff !important;
    padding: 10px 24px !important;
    border-radius: 12px !important;
    width: 100% !important;
    text-align: center !important;
    display: inline-block !important;
    text-decoration: none !important;
    margin: 0 auto !important;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease !important;
  }

  /* Remove all underline pseudo elements */
  .elementor-nav-menu--dropdown .elementor-item:after,
  .elementor-nav-menu--dropdown .elementor-item:before,
  .elementor-nav-menu--dropdown a:after,
  .elementor-nav-menu--dropdown a:before {
    display: none !important;
    content: none !important;
    height: 0 !important;
    width: 0 !important;
  }

  .elementor-nav-menu--dropdown .elementor-item:hover,
  .elementor-nav-menu--dropdown .elementor-item.elementor-item-active {
    background: rgba(0, 174, 254, 0.15) !important;
    color: #00AEFE !important;
    fill: #00AEFE !important;
    text-decoration: none !important;
  }

  /* Submit Story Pill Button inside Popup */
  .elementor-nav-menu--dropdown a[href*="submit-story"],
  .elementor-nav-menu--dropdown .menu-item-2098 a {
    background: linear-gradient(110deg, #00AEFE 0%, #B71F71 100%) !important;
    color: #ffffff !important;
    fill: #ffffff !important;
    font-family: 'Merriweather', Georgia, serif !important;
    font-size: 0.95rem !important;
    font-weight: 600 !important;
    padding: 14px 32px !important;
    border-radius: 50px !important;
    margin-top: 14px !important;
    box-shadow: 0 6px 24px rgba(0, 174, 254, 0.4) !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 8px !important;
    width: auto !important;
    min-width: 180px !important;
    text-decoration: none !important;
  }

  .elementor-nav-menu--dropdown a[href*="submit-story"]:hover {
    background: linear-gradient(110deg, #B71F71 0%, #00AEFE 100%) !important;
    transform: translateY(-2px) scale(1.03) !important;
    box-shadow: 0 8px 30px rgba(0, 174, 254, 0.55) !important;
    color: #ffffff !important;
    text-decoration: none !important;
  }

  .csp-mobile-menu-close {
    position: absolute !important;
    top: 16px !important;
    right: 16px !important;
    width: 36px !important;
    height: 36px !important;
    border-radius: 50% !important;
    background: rgba(255, 255, 255, 0.08) !important;
    border: 1px solid rgba(255, 255, 255, 0.18) !important;
    color: rgba(255, 255, 255, 0.85) !important;
    font-size: 1.4rem !important;
    line-height: 1 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    cursor: pointer !important;
    z-index: 1000000 !important;
    transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease !important;
  }
  .csp-mobile-menu-close:hover {
    background: rgba(255, 255, 255, 0.2) !important;
    color: #ffffff !important;
    transform: scale(1.08) !important;
  }
}

/* ── GLOBAL PILL BUTTON STYLING ───────────────────────────────────────────── */
.elementor-button,
.elementor-price-table__button,
.csp-hero-btn-primary,
.csp-hero-btn-secondary,
.wp-block-button__link,
input[type="submit"],
button[type="submit"],
.elementor-nav-menu--dropdown a[href*="submit-story"] {
  border-radius: 50px !important;
}
</style>

<script id="csp-mobile-menu-script">
(function() {
  function initMobileMenu() {
    var toggles = document.querySelectorAll('.elementor-element-27c23fa .elementor-menu-toggle');
    if (!toggles.length) {
      toggles = document.querySelectorAll('.elementor-menu-toggle');
    }
    toggles.forEach(function(toggle) {
      var container = toggle.closest('.elementor-widget-nav-menu');
      if (!container) return;
      var dropdown = container.querySelector('.elementor-nav-menu--dropdown');
      if (!dropdown) return;
      var ul = dropdown.querySelector('ul.elementor-nav-menu');
      if (!ul) return;

      function closeMenu() {
        dropdown.classList.add('csp-menu-closing');
        dropdown.classList.remove('csp-menu-open');
        document.body.classList.remove('csp-menu-is-open');
        toggle.classList.remove('elementor-active', 'elementor-menu-toggle--active');
        document.body.style.overflow = '';
        setTimeout(function() {
          dropdown.classList.remove('csp-menu-closing');
        }, 320);
      }

      if (!ul.querySelector('.csp-mobile-menu-close')) {
        var closeBtn = document.createElement('button');
        closeBtn.className = 'csp-mobile-menu-close';
        closeBtn.setAttribute('aria-label', 'Close Menu');
        closeBtn.innerHTML = '&times;';
        ul.appendChild(closeBtn);

        closeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          closeMenu();
        });

        dropdown.addEventListener('click', function(e) {
          if (e.target === dropdown) {
            closeMenu();
          }
        });

        dropdown.querySelectorAll('.elementor-item').forEach(function(link) {
          link.addEventListener('click', function() {
            closeMenu();
          });
        });
      }

      toggle.addEventListener('click', function(e) {
        setTimeout(function() {
          var isOpen = toggle.classList.contains('elementor-active') || toggle.classList.contains('elementor-menu-toggle--active') || dropdown.classList.contains('csp-menu-open');
          if (isOpen) {
            dropdown.classList.remove('csp-menu-closing');
            dropdown.classList.add('csp-menu-open');
            document.body.classList.add('csp-menu-is-open');
            document.body.style.overflow = 'hidden';
          } else {
            closeMenu();
          }
        }, 50);
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMobileMenu);
  } else {
    initMobileMenu();
  }
})();
</script>
