<script id="csp-mobile-menu-script">
  (function () {
    function getRootUrl(targetRoute) {
      var p = window.location.pathname;
      var isPublicDir = p.startsWith('/public') || p.includes('/public/');
      var prefix = isPublicDir ? '/public' : '';
      if (!targetRoute || targetRoute === '/' || targetRoute === './' || targetRoute === '../') {
        return prefix + '/';
      }
      var clean = targetRoute.replace(/^\.\.\//, '').replace(/^\.\//, '').replace(/^\//, '');
      return prefix + '/' + clean;
    }
    window.getRootUrl = getRootUrl;

    function getAbsoluteImageUrl(url) {
      if (!url) return getRootUrl('wp-content/uploads/2026/01/girls-walk-along-streets-city-scaled.jpg');
      var u = url.trim();
      if (u.startsWith('http://') || u.startsWith('https://') || u.startsWith('data:')) return u;
      if (u.startsWith('./')) return getRootUrl(u.slice(2));
      if (u.startsWith('/')) return getRootUrl(u.slice(1));
      return getRootUrl(u);
    }
    window.getAbsoluteImageUrl = getAbsoluteImageUrl;

    // Global Toast Notifications
    window.cspToast = function (message, type, duration) {
      type = type || 'info';
      duration = duration || 3500;

      var container = document.getElementById('csp-toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'csp-toast-container';
        document.body.appendChild(container);
      }

      var icons = {
        success: '🎉',
        danger: '🚨',
        info: 'ℹ️'
      };

      var toast = document.createElement('div');
      toast.className = 'csp-toast csp-toast-' + type;
      toast.innerHTML = '<span class="csp-toast-icon">' + (icons[type] || 'ℹ️') + '</span><span>' + message + '</span>';
      container.appendChild(toast);

      setTimeout(function () { toast.classList.add('show'); }, 10);

      setTimeout(function () {
        toast.classList.remove('show');
        setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 350);
      }, duration);
    };

    // Global Confirmation Modal (Promise-based)
    window.cspConfirm = function (options) {
      return new Promise(function (resolve) {
        options = options || {};
        var title = options.title || 'Confirm Action';
        var message = options.message || 'Are you sure you want to proceed?';
        var confirmText = options.confirmText || 'Yes, Proceed';
        var cancelText = options.cancelText || 'Cancel';
        var type = options.type || 'danger';

        var backdrop = document.getElementById('csp-confirm-backdrop');
        if (!backdrop) {
          backdrop = document.createElement('div');
          backdrop.id = 'csp-confirm-backdrop';
          backdrop.innerHTML = `
          <div class="csp-confirm-modal">
            <div class="csp-confirm-icon-box" id="csp-confirm-icon">⚠️</div>
            <h3 class="csp-confirm-title" id="csp-confirm-title"></h3>
            <p class="csp-confirm-desc" id="csp-confirm-desc"></p>
            <div class="csp-confirm-actions">
              <button type="button" class="csp-confirm-btn csp-confirm-cancel" id="csp-confirm-btn-cancel"></button>
              <button type="button" class="csp-confirm-btn" id="csp-confirm-btn-ok"></button>
            </div>
          </div>
        `;
          document.body.appendChild(backdrop);
        }

        var iconBox = document.getElementById('csp-confirm-icon');
        var titleEl = document.getElementById('csp-confirm-title');
        var descEl = document.getElementById('csp-confirm-desc');
        var cancelBtn = document.getElementById('csp-confirm-btn-cancel');
        var okBtn = document.getElementById('csp-confirm-btn-ok');

        titleEl.textContent = title;
        descEl.textContent = message;
        cancelBtn.textContent = cancelText;
        okBtn.textContent = confirmText;

        if (type === 'danger') {
          iconBox.className = 'csp-confirm-icon-box csp-confirm-icon-danger';
          iconBox.textContent = '🗑️';
          okBtn.className = 'csp-confirm-btn csp-confirm-danger-btn';
        } else {
          iconBox.className = 'csp-confirm-icon-box csp-confirm-icon-info';
          iconBox.textContent = '💡';
          okBtn.className = 'csp-confirm-btn csp-confirm-primary-btn';
        }

        backdrop.classList.add('show');

        function cleanup(result) {
          backdrop.classList.remove('show');
          cancelBtn.onclick = null;
          okBtn.onclick = null;
          resolve(result);
        }

        cancelBtn.onclick = function () { cleanup(false); };
        okBtn.onclick = function () { cleanup(true); };
      });
    };

    // Global Alert Modal / Polyfill
    window.cspAlert = function (message, title) {
      return cspConfirm({
        title: title || 'Notice',
        message: message,
        confirmText: 'OK',
        cancelText: 'Dismiss',
        type: 'info'
      });
    };

    // Polyfill native alert and confirm so any unhandled native calls automatically use custom UI
    window.alert = function (msg) {
      window.cspToast(msg, 'info');
    };

    function initLoaderAndLogo() {
      var loader = document.getElementById('csp-page-loader');

      function dismissLoader() {
        if (loader) {
          setTimeout(function () {
            loader.classList.add('loaded');
          }, 500);
        }
      }

      dismissLoader();

      // Event listeners for page restore/navigation
      window.addEventListener('pageshow', function () {
        if (loader) loader.classList.add('loaded');
      });
      window.addEventListener('popstate', function () {
        if (loader) loader.classList.add('loaded');
      });

      // Intercept link clicks to trigger loader transition with safety timeout
      document.addEventListener('click', function (e) {
        var a = e.target.closest('a[href]');
        if (!a) return;
        var href = a.getAttribute('href');
        if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:') || a.getAttribute('target') === '_blank') return;
        if (a.classList.contains('csp-tab-btn') || a.classList.contains('sub-filter-btn') || a.hasAttribute('data-sub-filter') || a.closest('#csp-login-screen') || a.closest('.csp-modal-card')) return;
        if (loader) {
          loader.classList.remove('loaded');
          // Safety fallback: auto-dismiss loader after 2.5s if full page navigation doesn't occur
          setTimeout(function () {
            if (loader) loader.classList.add('loaded');
          }, 2500);
        }
      });

      // Fix all header logos to strictly navigate back to Home root
      var homeUrl = getRootUrl('/');
      var logos = document.querySelectorAll('img.sticel-logo-shrink, .elementor-element-738d6a4 a, .elementor-element-2d4f26f a');
      logos.forEach(function (el) {
        var anchor = el.tagName.toLowerCase() === 'a' ? el : el.closest('a');
        if (anchor) {
          anchor.setAttribute('href', homeUrl);
          anchor.addEventListener('click', function (e) {
            e.preventDefault();
            if (loader) loader.classList.add('active');
            window.location.href = homeUrl;
          });
        }
      });

      // Normalize all menu item links in header nav & footer to prevent 404s and highlight active link
      var currentPath = window.location.pathname;
      if (!currentPath.endsWith('/') && !currentPath.includes('.')) currentPath += '/';

      document.querySelectorAll('.elementor-nav-menu a, .elementor-location-footer a').forEach(function (a) {
        var href = a.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('javascript:')) {
          var normHref = getRootUrl(href);
          a.setAttribute('href', normHref);

          var cleanHref = normHref;
          if (!cleanHref.endsWith('/') && !cleanHref.includes('.')) cleanHref += '/';

          if (currentPath === cleanHref || (cleanHref !== '/' && cleanHref !== getRootUrl('/') && currentPath.endsWith(cleanHref))) {
            a.classList.add('active-link');
            var li = a.closest('li');
            if (li) li.classList.add('current-menu-item', 'active-menu-item');
          }
        }
      });
    }

    function initMobileMenu() {
      var modal = document.getElementById('csp-mobile-menu-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'csp-mobile-menu-modal';

        var backdrop = document.createElement('div');
        backdrop.className = 'csp-modal-backdrop';

        var card = document.createElement('div');
        card.className = 'csp-modal-card';

        var headerRow = document.createElement('div');
        headerRow.className = 'csp-modal-header-row';

        var titleLabel = document.createElement('div');
        titleLabel.className = 'csp-modal-title-label';
        titleLabel.innerHTML = '<span>MENU</span>';

        var closeBtn = document.createElement('button');
        closeBtn.className = 'csp-mobile-menu-close';
        closeBtn.setAttribute('aria-label', 'Close Menu');
        closeBtn.innerHTML = '&times;';

        headerRow.appendChild(titleLabel);
        headerRow.appendChild(closeBtn);

        var ul = document.createElement('ul');
        ul.className = 'csp-modal-menu';

        var menuItems = [
          { text: 'Home', href: getRootUrl('/') },
          { text: 'About Us', href: getRootUrl('about-us/') },
          { text: 'Contact Us', href: getRootUrl('contact-us/') },
          { text: 'Stories', href: getRootUrl('stories/') },
          { text: 'Forum', href: getRootUrl('forum/') },
          { text: 'Sponsorship', href: getRootUrl('sponsorship/') },
          { text: 'Advert', href: getRootUrl('advert/') },
          { text: 'Submit Story', href: getRootUrl('submit-story/'), isCta: true }
        ];

        var currentPath = window.location.pathname.replace(/\/$/, '') || '/';

        menuItems.forEach(function (item) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.textContent = item.text;
          a.href = item.href;
          if (item.isCta) {
            a.className = 'csp-modal-cta';
          }
          var itemPath = item.href.replace(/\/$/, '') || '/';
          if (currentPath === itemPath || (itemPath !== '/' && currentPath.endsWith(itemPath))) {
            a.classList.add('active-link');
          }
          li.appendChild(a);
          ul.appendChild(li);
        });

        card.appendChild(headerRow);
        card.appendChild(ul);
        modal.appendChild(backdrop);
        modal.appendChild(card);
        document.body.appendChild(modal);

        function closeModal() {
          modal.classList.remove('active');
          document.body.style.overflow = '';
          document.querySelectorAll('.elementor-menu-toggle').forEach(function (t) {
            t.classList.remove('elementor-active', 'elementor-menu-toggle--active');
          });
        }

        backdrop.addEventListener('click', closeModal);
        closeBtn.addEventListener('click', closeModal);
        card.querySelectorAll('a').forEach(function (a) {
          a.addEventListener('click', closeModal);
        });
      }

      var toggles = document.querySelectorAll('.elementor-menu-toggle');
      toggles.forEach(function (toggle) {
        toggle.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          var m = document.getElementById('csp-mobile-menu-modal');
          if (m) {
            var isOpening = !m.classList.contains('active');
            if (isOpening) {
              m.classList.add('active');
              document.body.style.overflow = 'hidden';
            } else {
              m.classList.remove('active');
              document.body.style.overflow = '';
            }
          }
        });
      });
    }

    function initPopupAdvert() {
      if (window.location.pathname.includes('/dashboard')) return;

      fetch(getRootUrl('api/settings.php'))
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.success || !res.settings) return;

          var s = res.settings;
          var adverts = [];

          if (s.popup_adverts_list) {
            try { adverts = JSON.parse(s.popup_adverts_list); } catch (e) { }
          }

          // Fallback to legacy single advert if popup_adverts_list is empty
          if ((!adverts || adverts.length === 0) && s.popup_ad_enabled === '1') {
            adverts = [{
              id: 'legacy',
              enabled: true,
              title: s.popup_ad_title || '',
              image: s.popup_ad_image || '',
              targetPage: 'all',
              clickUrl: s.popup_ad_link || '#',
              delay: parseInt(s.popup_ad_delay) || 3
            }];
          }

          if (!adverts || adverts.length === 0) return;

          // Filter active adverts matching current page route or 'all' pages
          var matchingAds = adverts.filter(function (ad) {
            if (!ad.enabled) return false;
            var target = (ad.targetPage || 'all').trim();
            if (target === 'all' || target === '*') return true;

            var cleanTarget = target;
            if (!cleanTarget.endsWith('/') && !cleanTarget.includes('.')) cleanTarget += '/';

            return currentPath === cleanTarget || currentPath.endsWith(cleanTarget);
          });

          if (matchingAds.length === 0) return;

          matchingAds.forEach(function (ad) {
            var dismissKey = 'csp_popup_ad_dismissed_' + (ad.id || 'ad');
            if (sessionStorage.getItem(dismissKey)) return;

            var delayMs = (parseInt(ad.delay) || 3) * 1000;

            setTimeout(function () {
              if (sessionStorage.getItem(dismissKey)) return;

              var adModal = document.createElement('div');
              adModal.id = 'csp-popup-ad-modal-' + (ad.id || 'ad');
              adModal.style.cssText = 'position:fixed;inset:0;z-index:99999999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity 0.4s ease;padding:20px;';

              var card = document.createElement('div');
              card.style.cssText = 'position:relative;background:#061022;border:1px solid rgba(0,174,254,0.4);border-radius:24px;max-width:440px;width:100%;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.7), 0 0 40px rgba(0,174,254,0.25);transform:scale(0.9);transition:transform 0.4s ease;text-align:center;';

              var closeBtn = document.createElement('button');
              closeBtn.innerHTML = '&times;';
              closeBtn.style.cssText = 'position:absolute;top:12px;right:12px;z-index:10;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;';

              function closeAd() {
                sessionStorage.setItem(dismissKey, '1');
                adModal.style.opacity = '0';
                card.style.transform = 'scale(0.9)';
                setTimeout(function () { if (adModal.parentNode) adModal.parentNode.removeChild(adModal); }, 400);
              }

              closeBtn.addEventListener('click', closeAd);
              adModal.addEventListener('click', function (e) { if (e.target === adModal) closeAd(); });

              var imgHtml = ad.image ? '<img src="' + getRootUrl(ad.image) + '" style="width:100%;max-height:220px;object-fit:cover;" />' : '';
              var titleHtml = ad.title ? '<h3 style="font-family:\'Merriweather\',serif;font-size:1.25rem;color:#fff;margin:16px 20px 10px;line-height:1.4;">' + ad.title + '</h3>' : '';
              var linkUrl = ad.clickUrl ? getRootUrl(ad.clickUrl) : '#';

              card.innerHTML = imgHtml +
                '<div style="padding:4px 20px 24px;">' +
                titleHtml +
                '<a href="' + linkUrl + '" style="display:inline-block;margin-top:12px;padding:12px 28px;background:linear-gradient(110deg,#00AEFE 0%,#B71F71 100%);color:#fff;border-radius:50px;font-family:\'Merriweather\',serif;font-weight:600;text-decoration:none;box-shadow:0 6px 20px rgba(0,174,254,0.35);">Explore Now →</a>' +
                '</div>';

              card.appendChild(closeBtn);
              adModal.appendChild(card);
              document.body.appendChild(adModal);

              setTimeout(function () {
                adModal.style.opacity = '1';
                card.style.transform = 'scale(1)';
              }, 50);
            }, delayMs);
          });
        })
        .catch(function () { });
    }

    window.showSuccessModal = function (title, message) {
      var oldModal = document.getElementById('csp-global-success-modal');
      if (oldModal && oldModal.parentNode) oldModal.parentNode.removeChild(oldModal);

      var modal = document.createElement('div');
      modal.id = 'csp-global-success-modal';
      modal.style.cssText = 'position:fixed;inset:0;z-index:999999999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity 0.35s ease;padding:20px;';

      var card = document.createElement('div');
      card.style.cssText = 'position:relative;background:#061022;border:1px solid rgba(0,174,254,0.4);border-radius:24px;max-width:440px;width:100%;padding:32px 24px;box-shadow:0 24px 60px rgba(0,0,0,0.7), 0 0 40px rgba(0,174,254,0.25);transform:scale(0.9);transition:transform 0.35s ease;text-align:center;';

      var closeBtn = document.createElement('button');
      closeBtn.innerHTML = '&times;';
      closeBtn.style.cssText = 'position:absolute;top:14px;right:14px;z-index:10;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);color:#fff;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;';

      function closeModal() {
        modal.style.opacity = '0';
        card.style.transform = 'scale(0.9)';
        setTimeout(function () { if (modal.parentNode) modal.parentNode.removeChild(modal); }, 350);
      }

      card.innerHTML =
        '<div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,rgba(0,174,254,0.2),rgba(183,31,113,0.2));border:1px solid rgba(0,174,254,0.4);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 16px;">🎉</div>' +
        '<h3 style="font-family:\'Merriweather\',serif;font-size:1.3rem;color:#ffffff;margin-bottom:10px;line-height:1.3;">' + (title || 'Submission Successful!') + '</h3>' +
        '<p style="font-size:0.9rem;color:rgba(255,255,255,0.78);line-height:1.6;margin-bottom:24px;">' + (message || 'Thank you! Your information has been received.') + '</p>' +
        '<button id="csp-success-modal-btn" style="padding:12px 32px;background:linear-gradient(110deg,#00AEFE 0%,#B71F71 100%);color:#fff;border:none;border-radius:50px;font-family:\'Merriweather\',serif;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,174,254,0.35);font-size:0.92rem;">Got It →</button>';

      card.appendChild(closeBtn);
      modal.appendChild(card);
      document.body.appendChild(modal);

      var btn = card.querySelector('#csp-success-modal-btn');
      if (btn) btn.addEventListener('click', closeModal);

      setTimeout(function () {
        modal.style.opacity = '1';
        card.style.transform = 'scale(1)';
      }, 50);
    };

    function start() {
      initLoaderAndLogo();
      initMobileMenu();
      initPopupAdvert();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
</script>

<script>
  (function () {
    // 1. Reading Scroll Progress Bar
    function initScrollProgress() {
      var progressBar = document.getElementById('csp-scroll-progress');
      if (!progressBar) return;
      window.addEventListener('scroll', function () {
        var totalHeight = document.documentElement.scrollHeight - window.innerHeight;
        if (totalHeight > 0) {
          var pct = (window.scrollY / totalHeight) * 100;
          progressBar.style.width = Math.min(100, Math.max(0, pct)) + '%';
        }
      }, { passive: true });
    }

    // 2. Audio Narration Synth Player
    var synthUtterance = null;
    window.playArticleAudio = function (title, text) {
      var player = document.getElementById('csp-audio-player');
      var titleEl = document.getElementById('csp-ap-title');
      var toggleBtn = document.getElementById('csp-ap-toggle-btn');
      var statusEl = document.getElementById('csp-ap-status');
      if (!player || !titleEl) return;

      titleEl.textContent = title || 'Listening to Conspodium Article';
      player.classList.add('active');

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var cleanText = (title + '. ' + (text || '')).replace(/<[^>]*>?/gm, '');
        synthUtterance = new SpeechSynthesisUtterance(cleanText);
        synthUtterance.rate = 1.0;
        synthUtterance.pitch = 1.0;

        synthUtterance.onstart = function () {
          toggleBtn.textContent = '⏸';
          if (statusEl) statusEl.textContent = 'Narrating Story...';
        };
        synthUtterance.onend = function () {
          toggleBtn.textContent = '▶';
          if (statusEl) statusEl.textContent = 'Finished Narration';
        };

        window.speechSynthesis.speak(synthUtterance);
      } else {
        cspToast('Audio narration synthesiser not supported in this browser', 'info');
      }
    };

    function initAudioPlayer() {
      var toggleBtn = document.getElementById('csp-ap-toggle-btn');
      var closeBtn = document.getElementById('csp-ap-close-btn');
      var player = document.getElementById('csp-audio-player');

      if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
          if ('speechSynthesis' in window) {
            if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
              window.speechSynthesis.pause();
              toggleBtn.textContent = '▶';
            } else if (window.speechSynthesis.paused) {
              window.speechSynthesis.resume();
              toggleBtn.textContent = '⏸';
            } else if (synthUtterance) {
              window.speechSynthesis.speak(synthUtterance);
              toggleBtn.textContent = '⏸';
            }
          }
        });
      }

      if (closeBtn && player) {
        closeBtn.addEventListener('click', function () {
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          player.classList.remove('active');
        });
      }
    }

    // 3. Instant Live Search Modal
    function initLiveSearchModal() {
      var searchTriggers = document.querySelectorAll('a[href*="search"], .fa-search, .elementor-search-form, .eael-search-icon, .header-search-icon');

      // Create Modal HTML
      var searchModal = document.createElement('div');
      searchModal.id = 'csp-search-modal';
      searchModal.style.cssText = 'position:fixed;inset:0;z-index:9999999;display:flex;flex-direction:column;align-items:center;padding:80px 20px 40px;background:rgba(5,13,26,0.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:all 0.3s ease;';

      searchModal.innerHTML =
        '<div style="max-width:700px;width:100%;position:relative;">' +
        '<div style="display:flex;align-items:center;gap:14px;background:#09152b;border:1.5px solid rgba(0,174,254,0.4);border-radius:50px;padding:12px 24px;box-shadow:0 12px 36px rgba(0,0,0,0.5), 0 0 24px rgba(0,174,254,0.25);">' +
        '<span style="font-size:1.2rem;color:#00AEFE;">🔍</span>' +
        '<input type="text" id="csp-search-input" placeholder="Search articles, topics, scholars..." style="flex:1;background:none;border:none;outline:none;color:#fff;font-size:1.05rem;font-family:\'Inter\',sans-serif;" />' +
        '<button id="csp-search-close-btn" style="background:none;border:none;color:rgba(255,255,255,0.6);font-size:1.5rem;cursor:pointer;padding:0 6px;">&times;</button>' +
        '</div>' +
        '<div id="csp-search-results" style="margin-top:24px;display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow-y:auto;padding-right:6px;"></div>' +
        '</div>';

      document.body.appendChild(searchModal);

      var inputEl = searchModal.querySelector('#csp-search-input');
      var resultsEl = searchModal.querySelector('#csp-search-results');
      var closeBtn = searchModal.querySelector('#csp-search-close-btn');

      function openSearch(e) {
        if (e) e.preventDefault();
        searchModal.style.opacity = '1';
        searchModal.style.pointerEvents = 'auto';
        if (inputEl) { inputEl.value = ''; inputEl.focus(); }
        if (resultsEl) resultsEl.innerHTML = '<div style="color:rgba(255,255,255,0.45);text-align:center;padding:30px;font-size:0.9rem;">Type any keyword to search live articles...</div>';
      }

      function closeSearch() {
        searchModal.style.opacity = '0';
        searchModal.style.pointerEvents = 'none';
      }

      searchTriggers.forEach(function (trig) { trig.addEventListener('click', openSearch); });
      if (closeBtn) closeBtn.addEventListener('click', closeSearch);
      searchModal.addEventListener('click', function (e) { if (e.target === searchModal) closeSearch(); });

      // Live API Fetch on Type
      var debounceTmr = null;
      if (inputEl) {
        inputEl.addEventListener('input', function () {
          clearTimeout(debounceTmr);
          var query = inputEl.value.trim();
          if (!query) {
            resultsEl.innerHTML = '<div style="color:rgba(255,255,255,0.45);text-align:center;padding:30px;font-size:0.9rem;">Type any keyword to search live articles...</div>';
            return;
          }

          resultsEl.innerHTML = '<div style="color:#00AEFE;text-align:center;padding:24px;font-size:0.9rem;">Searching database...</div>';

          debounceTmr = setTimeout(function () {
            var url = window.getRootUrl ? window.getRootUrl('api/posts.php?search=' + encodeURIComponent(query)) : './api/posts.php?search=' + encodeURIComponent(query);
            fetch(url)
              .then(function (r) { return r.json(); })
              .then(function (res) {
                if (!res.success || !res.posts || res.posts.length === 0) {
                  resultsEl.innerHTML = '<div style="color:rgba(255,255,255,0.5);text-align:center;padding:24px;font-size:0.9rem;">No articles found matching "' + query + '"</div>';
                  return;
                }

                var html = '';
                res.posts.forEach(function (post) {
                  var postLink = window.getRootUrl ? window.getRootUrl('post/' + post.slug + '/') : './post/' + post.slug + '/';
                  var imgUrl = post.featured_image ? (window.getRootUrl ? window.getRootUrl(post.featured_image) : post.featured_image) : '';

                  html += '<a href="' + postLink + '" style="display:flex;align-items:center;gap:16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 18px;text-decoration:none;transition:background 0.2s,border-color 0.2s;" onmouseover="this.style.background=\'rgba(0,174,254,0.08)\';this.style.borderColor=\'rgba(0,174,254,0.3)\';" onmouseout="this.style.background=\'rgba(255,255,255,0.05)\';this.style.borderColor=\'rgba(255,255,255,0.08)\';">';
                  if (imgUrl) html += '<img src="' + imgUrl + '" style="width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;" />';
                  html += '<div style="flex:1;"><div style="font-size:0.75rem;font-weight:700;color:#00AEFE;text-transform:uppercase;margin-bottom:2px;">' + (post.category_name || 'Article') + '</div><div style="font-size:0.95rem;font-weight:600;color:#ffffff;line-height:1.35;">' + post.title + '</div></div>';
                  html += '<span style="font-size:0.85rem;color:#00AEFE;">Read →</span>';
                  html += '</a>';
                });
                resultsEl.innerHTML = html;
              })
              .catch(function () {
                resultsEl.innerHTML = '<div style="color:rgba(255,255,255,0.5);text-align:center;padding:24px;">Search currently unavailable</div>';
              });
          }, 280);
        });
      }
    }

    // 4. Back-to-Top Floating Button
    function initBackToTop() {
      var btt = document.getElementById('csp-back-to-top');
      if (!btt) {
        btt = document.createElement('button');
        btt.id = 'csp-back-to-top';
        btt.setAttribute('aria-label', 'Back to top');
        btt.setAttribute('title', 'Back to top');
        btt.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>';
        document.body.appendChild(btt);
      }
      window.addEventListener('scroll', function () {
        if (window.scrollY > 300) {
          btt.classList.add('visible');
        } else {
          btt.classList.remove('visible');
        }
      }, { passive: true });
      btt.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    // 4.5 Dynamic Sticky Header Scroll Toggler
    function initStickyHeader() {
      var headers = document.querySelectorAll('.elementor-location-header, .she-header, .elementor-element-2d9e131');
      if (!headers.length) return;

      function handleHeaderScroll() {
        var isScrolled = window.scrollY > 15;
        headers.forEach(function (h) {
          if (isScrolled) {
            h.classList.add('is-sticky');
          } else {
            h.classList.remove('is-sticky');
          }
        });
        if (isScrolled) {
          document.body.classList.add('header-is-sticky');
        } else {
          document.body.classList.remove('header-is-sticky');
        }
      }

      window.addEventListener('scroll', handleHeaderScroll, { passive: true });
      handleHeaderScroll();
    }

    // 5. Initialise All Features
    function startEnhancements() {
      initScrollProgress();
      initAudioPlayer();
      initLiveSearchModal();
      initBackToTop();
      initStickyHeader();
    }

    // 6. Global Post Card Click Handler
    document.addEventListener('click', function (e) {
      var card = e.target.closest('.eael-grid-post, .csp-card-item');
      if (card && !e.target.closest('a') && !e.target.closest('button')) {
        var link = card.querySelector('a');
        if (link && link.href) {
          window.location.href = link.href;
        }
      }
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startEnhancements);
    } else {
      startEnhancements();
    }
  })();
</script>
<script>
  // Instant fallback loader dismiss safety
  (function () {
    function dismiss() {
      var l = document.getElementById('csp-page-loader');
      if (l) {
        l.classList.add('loaded');
        l.style.setProperty('display', 'none', 'important');
        l.style.setProperty('opacity', '0', 'important');
        l.style.setProperty('pointer-events', 'none', 'important');
        l.style.setProperty('visibility', 'hidden', 'important');
      }
    }
    dismiss();
    if (document.readyState === 'complete') dismiss();
    else window.addEventListener('load', dismiss);
    document.addEventListener('DOMContentLoaded', dismiss);
    setTimeout(dismiss, 100);
    setTimeout(dismiss, 300);
  })();

<script>
  // Global Community Subscriber Form Handler & Modal Popup System
  (function () {
    function showSubscriberModal(isAlreadySubscribed, message) {
      var overlay = document.getElementById('csp-sub-modal-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'csp-sub-modal-overlay';
        overlay.className = 'csp-sub-modal-overlay';
        document.body.appendChild(overlay);
      }

      var iconClass = isAlreadySubscribed ? 'info' : 'success';
      var iconSvg = isAlreadySubscribed 
        ? '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
        : '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      var title = isAlreadySubscribed ? 'Already Subscribed! 📧' : 'Welcome to the Community! 🎉';
      var desc = message || (isAlreadySubscribed 
        ? 'You are already registered in the Conspodium newsletter database. You will receive all upcoming weekly digests.' 
        : 'Thank you for subscribing to Conspodium! Check your inbox shortly for your first curated newsletter digest.');

      overlay.innerHTML = '<div class="csp-sub-modal-box">' +
        '<button type="button" class="csp-sub-modal-close" onclick="closeSubscriberModal()">&times;</button>' +
        '<div class="csp-sub-modal-icon ' + iconClass + '">' + iconSvg + '</div>' +
        '<h3 class="csp-sub-modal-title">' + title + '</h3>' +
        '<p class="csp-sub-modal-desc">' + desc + '</p>' +
        '<button type="button" class="csp-sub-modal-btn ' + iconClass + '" onclick="closeSubscriberModal()">Got It, Thanks!</button>' +
      '</div>';

      overlay.onclick = function (e) {
        if (e.target === overlay) closeSubscriberModal();
      };

      requestAnimationFrame(function () {
        overlay.classList.add('active');
      });
    }

    window.closeSubscriberModal = function () {
      var overlay = document.getElementById('csp-sub-modal-overlay');
      if (overlay) overlay.classList.remove('active');
    };

    function initSubscriberForms() {
      var forms = document.querySelectorAll('form#fluentform_2, form.eael-fluent-form-subscription form');
      forms.forEach(function (form) {
        if (form.dataset.cspSubBound) return;
        form.dataset.cspSubBound = 'true';

        form.addEventListener('submit', function (e) {
          e.preventDefault();

          var btn = form.querySelector('button[type="submit"]') || form.querySelector('button');
          var nameInput = form.querySelector('input[name*="first_name"]') || form.querySelector('input[name="name"]');
          var emailInput = form.querySelector('input[name="email"]') || form.querySelector('input[type="email"]');

          var email = emailInput ? emailInput.value.trim() : '';
          var name = nameInput ? nameInput.value.trim() : '';

          if (!email) {
            if (typeof cspToast === 'function') cspToast('Please enter a valid email address.', 'danger');
            else alert('Please enter a valid email address.');
            return;
          }

          var origText = btn ? btn.innerHTML : 'Subscribe';
          if (btn) {
            btn.disabled = true;
            btn.innerHTML = 'Subscribing...';
          }

          var payload = {
            name: name,
            email: email,
            list_segment: 'community'
          };

          fetch(getRootUrl('api/newsletter.php?action=subscribe'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          })
            .then(function (r) { return r.json(); })
            .then(function (res) {
              if (btn) {
                btn.disabled = false;
                btn.innerHTML = origText;
              }

              if (res.success) {
                form.reset();
                showSubscriberModal(!!res.already_subscribed, res.message);
              } else {
                if (typeof cspToast === 'function') {
                  cspToast(res.error || 'Subscription failed. Please try again.', 'danger');
                } else {
                  alert(res.error || 'Subscription failed. Please try again.');
                }
              }
            })
            .catch(function (err) {
              console.error('Subscription submission error:', err);
              if (btn) {
                btn.disabled = false;
                btn.innerHTML = origText;
              }
              if (typeof cspToast === 'function') {
                cspToast('Network error. Please try again.', 'danger');
              } else {
                alert('Network error. Please try again.');
              }
            });
        });
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSubscriberForms);
    } else {
      initSubscriberForms();
    }
  })();

    '🏛️': 'heritage',
    '🏛': 'heritage',
    '💡': 'lightbulb',

  };

  window.getCategorySvgIcon = window.getCspCategorySvg = function(catOrKey) {
    if (!catOrKey) return window.CSP_ICONS['globe'];
    
    var slug = '';
    var name = '';
    var icon = '';

    if (typeof catOrKey === 'string') {
      var str = catOrKey.trim();
      if (EMOJI_TO_SVG_KEY[str]) return window.CSP_ICONS[EMOJI_TO_SVG_KEY[str]];
      if (window.CSP_ICONS[str.toLowerCase()]) return window.CSP_ICONS[str.toLowerCase()];
      slug = str.toLowerCase();
      name = slug;
      icon = slug;
    } else if (typeof catOrKey === 'object' && catOrKey !== null) {
      slug = (catOrKey.slug || catOrKey.category_slug || '').toLowerCase().trim();
      name = (catOrKey.name || catOrKey.category_name || '').toLowerCase().trim();
      icon = (catOrKey.icon || catOrKey.category_icon || '').trim();
    }

    // 1. Direct slug match (e.g. 'african-diaspora-matters', 'culture-heritage', 'art-entertainment', 'all', etc.)
    if (slug && window.CSP_ICONS[slug]) return window.CSP_ICONS[slug];

    // 2. Direct icon emoji conversion
    if (icon && EMOJI_TO_SVG_KEY[icon]) return window.CSP_ICONS[EMOJI_TO_SVG_KEY[icon]];

    // 3. Direct icon key match (if icon is 'globe', 'palette', etc.)
    if (icon && window.CSP_ICONS[icon.toLowerCase()]) return window.CSP_ICONS[icon.toLowerCase()];

    // 4. Combined text pattern matching on slug + name
    var combined = (slug + ' ' + name).toLowerCase();

    if (combined.includes('all') || slug === 'all') return window.CSP_ICONS['grid'];
    if (combined.includes('culture') || combined.includes('heritage')) return window.CSP_ICONS['heritage'];
    if (combined.includes('innovation') || combined.includes('tech')) return window.CSP_ICONS['lightbulb'];
    if (combined.includes('art') || combined.includes('entertainment')) return window.CSP_ICONS['palette'];
    if (combined.includes('community')) return window.CSP_ICONS['users'];
    if (combined.includes('success')) return window.CSP_ICONS['star'];
    if (combined.includes('insight') || combined.includes('analysis')) return window.CSP_ICONS['bar-chart'];
    if (combined.includes('business') || combined.includes('trade')) return window.CSP_ICONS['briefcase'];
    if (combined.includes('travel') || combined.includes('mobility')) return window.CSP_ICONS['plane'];
    if (combined.includes('health') || combined.includes('medical')) return window.CSP_ICONS['heart-pulse'];
    return window.CSP_ICONS['globe'];
  };

  window.handleCspVote = function(btn, optionText, percentage) {
    var container = btn.closest('.csp-poll-options');
    if (!container) return;
    
    var options = [
      { label: 'Tech & AI Infrastructure', pct: 42, icon: window.CSP_ICONS['lightbulb'] },
      { label: 'Cultural Heritage & Arts', pct: 35, icon: window.CSP_ICONS['heritage'] },
      { label: 'Diaspora Capital & Trade', pct: 23, icon: window.CSP_ICONS['briefcase'] }
    ];
    
    var html = '';
    options.forEach(function(opt) {
      var isChosen = optionText.toLowerCase().indexOf(opt.label.split(' ')[0].toLowerCase()) !== -1;
      html += '<div style="margin-bottom:8px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;font-size:0.78rem;font-weight:600;color:' + (isChosen ? '#00AEFE' : '#475569') + ';margin-bottom:4px;">' +
          '<span style="display:inline-flex;align-items:center;gap:4px;">' + opt.icon + ' ' + opt.label + (isChosen ? ' <strong style="color:#00AEFE;margin-left:4px;">(Your Vote)</strong>' : '') + '</span>' +
          '<span style="font-weight:700;">' + opt.pct + '%</span>' +
        '</div>' +
        '<div style="height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;">' +
          '<div style="height:100%;width:' + opt.pct + '%;background:' + (isChosen ? 'linear-gradient(90deg, #00AEFE, #B71F71)' : '#cbd5e1') + ';border-radius:4px;transition:width 0.6s ease;"></div>' +
        '</div>' +
      '</div>';
    });
    
    container.innerHTML = html;
    if (window.cspToast) window.cspToast('Vote recorded for "' + optionText + '"!', 'success');
