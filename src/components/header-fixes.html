<!-- CSP_HEADER_FIXES_START -->
<!--
  src/components/header-fixes.html
  =====================================================================
  Injected into <head> of every built page.
  Fixes Elementor/WordPress quirks in the static clone.
  =====================================================================
-->
<style>/* conspodium-fix-preloader */
#sl-preloader { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }
</style>
<style id="csp-header-fixes">
/* Hide the sticky spacer clone that creates a blank gap at top of page */
.elementor-sticky__spacer { display: none !important; }
/* Ensure the real fixed header is always visible */
.she-header-yes, .elementor-sticky { visibility: visible !important; }
/* Fix logo images collapsed to height:0 by JS at crawl time */
img.sticel-logo-shrink { height: auto !important; max-height: 80px !important; width: auto !important; opacity: 1 !important; }

/* ── TEXT COLOR OVERRIDE: Countdown Title "The Future of African Democracy" ─ */
.csp-cd-title,
#csp-countdown .csp-cd-title,
section#csp-countdown h2.csp-cd-title {
  color: #ffffff !important;
  font-family: 'Merriweather', Georgia, serif !important;
}

/* ── LOGO FIX: Desktop/tablet logo must be visible on non-mobile screens ────── */
@media (min-width: 768px) {
  .elementor .elementor-hidden-mobile,
  .elementor-hidden-mobile {
    display: block !important;
  }
  .elementor-element-738d6a4 img,
  .elementor-element-738d6a4 .elementor-widget-container {
    display: block !important;
    max-height: 68px !important;
    width: auto !important;
    height: auto !important;
    opacity: 1 !important;
  }
}

/* Mobile square logo (2d4f26f): show ONLY on mobile, hide on tablet + desktop */
.elementor-element-2d4f26f {
  display: none !important;
}
@media (max-width: 767px) {
  .elementor-element-2d4f26f {
    display: block !important;
  }
  .elementor-element-2d4f26f img,
  .elementor-element-2d4f26f .elementor-widget-container {
    display: block !important;
    max-height: 52px !important;
    width: auto !important;
    opacity: 1 !important;
  }
}

/* ── HAMBURGER FIX: push burger to far right edge of header (mobile only) ───── */
@media (max-width: 767px) {
  .elementor-element-27c23fa {
    flex: 1 !important;
    display: flex !important;
    justify-content: flex-end !important;
    align-items: center !important;
    padding-right: 0 !important;
    margin-left: 0 !important;
  }
  .elementor-element-27c23fa .elementor-menu-toggle,
  .elementor-element-27c23fa .elementor-nav-menu-toggle {
    margin-left: auto !important;
    margin-right: 0 !important;
  }
}

/* ── NAV TEXT: Homepage (white text over dark hero) ───────────────────────── */
body.home .elementor-1969 .elementor-nav-menu--main .elementor-item {
  color: #ffffff !important;
  fill: #ffffff !important;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
body.home .elementor-1969 .elementor-nav-menu--main .elementor-item:hover,
body.home .elementor-1969 .elementor-nav-menu--main .elementor-item.elementor-item-active {
  color: #00AEFE !important;
  fill: #00AEFE !important;
  text-shadow: none;
}
body.home .elementor-1969 .elementor-menu-toggle,
body.home .elementor-1969 .elementor-menu-toggle i {
  color: #ffffff !important;
}

/* ── NAV TEXT: Inner Pages (dark black text over white/light hero) ─────────── */
body:not(.home) .elementor-1969 .elementor-nav-menu--main .elementor-item {
  color: #0f172a !important;
  fill: #0f172a !important;
  text-shadow: none !important;
}
body:not(.home) .elementor-1969 .elementor-nav-menu--main .elementor-item:hover,
body:not(.home) .elementor-1969 .elementor-nav-menu--main .elementor-item.elementor-item-active {
  color: #00AEFE !important;
  fill: #00AEFE !important;
  text-shadow: none !important;
}
body:not(.home) .elementor-1969 .elementor-menu-toggle,
body:not(.home) .elementor-1969 .elementor-menu-toggle i {
  color: #0f172a !important;
}

/* ── HIDE DEFAULT ELEMENTOR DROPDOWNS (REPLACED BY CSP STANDALONE MODAL) ────── */
.elementor-nav-menu--dropdown {
  display: none !important;
  visibility: hidden !important;
  pointer-events: none !important;
  opacity: 0 !important;
}

/* ── STANDALONE MOBILE MODAL (ATTACHED TO BODY) ────────────────────────────── */
#csp-mobile-menu-modal {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  z-index: 99999999 !important;
  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
  opacity: 0;
  pointer-events: none;
  visibility: hidden;
  transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.32s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

#csp-mobile-menu-modal.active {
  opacity: 1 !important;
  pointer-events: auto !important;
  visibility: visible !important;
}

/* Dark blurry backdrop BEHIND card */
.csp-modal-backdrop {
  position: absolute !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  width: 100% !important;
  height: 100% !important;
  background: rgba(0, 0, 0, 0.25) !important;
  backdrop-filter: blur(10px) !important;
  -webkit-backdrop-filter: blur(10px) !important;
  z-index: 1 !important;
}

/* Menu card ON TOP of backdrop */
.csp-modal-card {
  position: relative !important;
  z-index: 2 !important;
  width: 88% !important;
  max-width: 360px !important;
  background: rgba(6, 16, 34, 0.92) !important;
  backdrop-filter: blur(24px) !important;
  -webkit-backdrop-filter: blur(24px) !important;
  border: 1px solid rgba(0, 174, 254, 0.3) !important;
  border-radius: 28px !important;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 174, 254, 0.2) !important;
  padding: 60px 20px 32px !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  transform: scale(0.85) translateY(24px);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

#csp-mobile-menu-modal.active .csp-modal-card {
  transform: scale(1) translateY(0);
}

.csp-modal-card ul.csp-modal-menu {
  list-style: none !important;
  margin: 0 !important;
  padding: 0 !important;
  width: 100% !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  gap: 8px !important;
}

.csp-modal-card ul.csp-modal-menu > li:first-child {
  margin-top: 6px !important;
}

.csp-modal-card li {
  width: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  display: flex !important;
  justify-content: center !important;
}

.csp-modal-card a {
  font-family: 'Merriweather', Georgia, serif !important;
  font-size: 1.12rem !important;
  font-weight: 500 !important;
  color: #ffffff !important;
  fill: #ffffff !important;
  padding: 10px 24px !important;
  border-radius: 12px !important;
  width: 100% !important;
  text-align: center !important;
  display: inline-block !important;
  text-decoration: none !important;
  margin: 0 auto !important;
  transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease !important;
}

.csp-modal-card a:hover,
.csp-modal-card a.active-link {
  background: rgba(0, 174, 254, 0.15) !important;
  color: #00AEFE !important;
  fill: #00AEFE !important;
  text-decoration: none !important;
}

/* Submit Story Pill Button inside Modal */
.csp-modal-card a.csp-modal-cta {
  background: linear-gradient(110deg, #00AEFE 0%, #B71F71 100%) !important;
  color: #ffffff !important;
  fill: #ffffff !important;
  font-family: 'Merriweather', Georgia, serif !important;
  font-size: 0.95rem !important;
  font-weight: 600 !important;
  padding: 14px 32px !important;
  border-radius: 50px !important;
  margin-top: 14px !important;
  box-shadow: 0 6px 24px rgba(0, 174, 254, 0.4) !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 8px !important;
  width: auto !important;
  min-width: 180px !important;
  text-decoration: none !important;
}

.csp-modal-card a.csp-modal-cta:hover {
  background: linear-gradient(110deg, #B71F71 0%, #00AEFE 100%) !important;
  transform: translateY(-2px) scale(1.03) !important;
  box-shadow: 0 8px 30px rgba(0, 174, 254, 0.55) !important;
  color: #ffffff !important;
  text-decoration: none !important;
}

.csp-mobile-menu-close {
  position: absolute !important;
  top: 16px !important;
  right: 16px !important;
  width: 36px !important;
  height: 36px !important;
  border-radius: 50% !important;
  background: rgba(255, 255, 255, 0.08) !important;
  border: 1px solid rgba(255, 255, 255, 0.18) !important;
  color: rgba(255, 255, 255, 0.85) !important;
  font-size: 1.4rem !important;
  line-height: 1 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  cursor: pointer !important;
  z-index: 10 !important;
  transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease !important;
}
.csp-mobile-menu-close:hover {
  background: rgba(255, 255, 255, 0.2) !important;
  color: #ffffff !important;
  transform: scale(1.08) !important;
}

/* ── GLOBAL PILL BUTTON STYLING ───────────────────────────────────────────── */
.elementor-button,
.elementor-price-table__button,
.csp-hero-btn-primary,
.csp-hero-btn-secondary,
.wp-block-button__link,
input[type="submit"],
button[type="submit"],
.csp-modal-cta {
  border-radius: 50px !important;
}
</style>

<script id="csp-mobile-menu-script">
(function() {
  function initMobileMenu() {
    var modal = document.getElementById('csp-mobile-menu-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'csp-mobile-menu-modal';

      var backdrop = document.createElement('div');
      backdrop.className = 'csp-modal-backdrop';

      var card = document.createElement('div');
      card.className = 'csp-modal-card';

      var closeBtn = document.createElement('button');
      closeBtn.className = 'csp-mobile-menu-close';
      closeBtn.setAttribute('aria-label', 'Close Menu');
      closeBtn.innerHTML = '&times;';

      var ul = document.createElement('ul');
      ul.className = 'csp-modal-menu';

      var menuItems = [
        { text: 'Home', href: './' },
        { text: 'About Us', href: './about-us/' },
        { text: 'Contact Us', href: './contact-us/' },
        { text: 'Stories', href: './stories/' },
        { text: 'Sponsorship', href: './sponsorship/' },
        { text: 'Advert', href: './advert/' },
        { text: 'Submit Story', href: './submit-story/', isCta: true }
      ];

      var currentPath = window.location.pathname.replace(/\/$/, '') || '/';

      menuItems.forEach(function(item) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.textContent = item.text;
        a.href = item.href;
        if (item.isCta) {
          a.className = 'csp-modal-cta';
        }
        var itemPath = item.href.replace(/^\./, '').replace(/\/$/, '') || '/';
        if (currentPath === itemPath || (itemPath !== '/' && currentPath.endsWith(itemPath))) {
          a.classList.add('active-link');
        }
        li.appendChild(a);
        ul.appendChild(li);
      });

      card.appendChild(closeBtn);
      card.appendChild(ul);
      modal.appendChild(backdrop);
      modal.appendChild(card);
      document.body.appendChild(modal);

      function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
        document.querySelectorAll('.elementor-menu-toggle').forEach(function(t) {
          t.classList.remove('elementor-active', 'elementor-menu-toggle--active');
        });
      }

      backdrop.addEventListener('click', closeModal);
      closeBtn.addEventListener('click', closeModal);
      card.querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', closeModal);
      });
    }

    var toggles = document.querySelectorAll('.elementor-menu-toggle');
    toggles.forEach(function(toggle) {
      toggle.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var m = document.getElementById('csp-mobile-menu-modal');
        if (m) {
          var isOpening = !m.classList.contains('active');
          if (isOpening) {
            m.classList.add('active');
            document.body.style.overflow = 'hidden';
          } else {
            m.classList.remove('active');
            document.body.style.overflow = '';
          }
        }
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMobileMenu);
  } else {
    initMobileMenu();
  }
})();
</script>
<!-- CSP_HEADER_FIXES_END -->
